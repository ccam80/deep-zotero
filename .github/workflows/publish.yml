name: publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Tag, pyproject, manifest and pinned package must agree
        run: |
          python3 - "$GITHUB_REF_NAME" <<'PY'
          import json, pathlib, re, sys, tomllib

          tag = sys.argv[1].removeprefix("v")
          project = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          manifest = json.loads(
              pathlib.Path("plugin/.claude-plugin/plugin.json").read_text(encoding="utf-8")
          )
          plugin = manifest["version"]
          args = manifest["mcpServers"]["deep-zotero"]["args"]
          pins = [re.fullmatch(r"deep-zotero\[vision\]==(.+)", a) for a in args]
          pin = next((p.group(1) for p in pins if p), None)

          print(f"tag={tag} pyproject={project} manifest={plugin} pin={pin}")
          if len({tag, project, plugin, pin}) != 1:
              sys.exit("versions disagree")
          PY

      - run: uv build

      - name: Confirm the wheel imports and exposes its entry points
        run: |
          uv venv /tmp/check
          uv pip install --python /tmp/check/bin/python dist/*.whl
          /tmp/check/bin/python -c "import deep_zotero; print(deep_zotero.__name__)"
          test -x /tmp/check/bin/deep-zotero
          test -x /tmp/check/bin/deep-zotero-index

      - run: uv publish --check-url https://pypi.org/simple/deep-zotero/
