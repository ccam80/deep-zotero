[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-zotero"
version = "0.2.2"
description = "Deep semantic search for Zotero libraries"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chris Cameron" }]
keywords = ["zotero", "semantic-search", "mcp", "research", "chromadb", "pdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "chromadb>=0.4.0",
    "google-genai>=1.0.0",
    "pymupdf>=1.25.0",
    "pymupdf-layout",
    "pymupdf4llm>=0.0.17",
    "fastmcp>=2.9.0",
    "tqdm>=4.0.0",
    "pydantic>=2.0.0",
    "rapidfuzz>=3.0.0",
]

[project.optional-dependencies]
vision = [
    "anthropic>=0.40.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "anthropic>=0.40.0",
]

[project.urls]
Homepage = "https://github.com/ccam80/deep-zotero"
Repository = "https://github.com/ccam80/deep-zotero"
Issues = "https://github.com/ccam80/deep-zotero/issues"

[project.scripts]
deep-zotero = "deep_zotero.server:main"
deep-zotero-index = "deep_zotero.cli:main"

[tool.pytest.ini_options]
addopts = "-m 'not vision_api'"
markers = [
    "vision_api: tests that make real Anthropic API calls (run with: pytest -m vision_api)",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deep_zotero = ["data/*.csv"]
